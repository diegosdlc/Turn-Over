name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble stable site and PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # Always publish the stable main branch at the Pages root.
          git archive HEAD | tar -x -C _site

          # Publish every open same-repository PR below /preview/pr-<number>/.
          # Fork PRs are deliberately skipped so untrusted code is never served
          # from the project's GitHub Pages origin.
          mapfile -t prs < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .number'
          )

          for pr in "${prs[@]}"; do
            echo "Building preview for PR #${pr}"
            git fetch --force --no-tags origin \
              "pull/${pr}/head:refs/remotes/origin/pr-${pr}"
            mkdir -p "_site/preview/pr-${pr}"
            git archive "refs/remotes/origin/pr-${pr}" | \
              tar -x -C "_site/preview/pr-${pr}"
          done

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The artifact upload API can complete before the Actions listing API
      # can see it. deploy-pages fails if the artifact is not indexed yet.
      - name: Wait for Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [[ "$count" == "1" ]]; then
              echo "Pages artifact is visible."
              sleep 5
              exit 0
            fi
            if (( count > 1 )); then
              echo "::error::Multiple Pages artifacts in this run."
              exit 1
            fi
            echo "Artifact not visible yet (attempt ${attempt}); retrying."
            sleep 5
          done
          echo "::error::Pages artifact not indexed after waiting."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
